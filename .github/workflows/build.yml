name: Build

on:
  pull_request:
    branches: [main]

# job id가 상태 체크 이름이 된다 — `test`(test.yml)와 겹치지 않게 `build`로 둔다.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
