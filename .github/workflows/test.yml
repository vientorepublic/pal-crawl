name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      # 크롤러 계약 검증기(scripts/check-site-drift.js)의 분류·판정 로직 검증.
      # dist가 필요 없는 오프라인 테스트라 빌드 전에 돌려도 된다.
      - name: Run contract checker self-test
        run: npm run drift:self-test
      # 계약 매니페스트(scripts/drift-contracts)와 src 소스의 대조.
      # 파서를 고치고 계약을 두면 여기서 실패한다 — 계약 변경이 같은 PR에 묶이게 하는 장치.
      - name: Verify contract manifest against src
        run: npm run drift:contracts
