name: Contract check (daily)

# 크롤러 계약 검증 (정기) — 대상 사이트(PAL·NSM·LIKMS)의 DOM·AJAX 계약이 실사이트에서
# 그대로인지 24시간마다 확인한다. 계약이 깨지면(선택자·엔드포인트·필드가 사라지면)
# 파서는 규약상 예외를 던지지 않고 빈 값·null을 돌려주므로(AGENTS.md "파서는 절대
# 예외를 던지지 않는다"), 그 회귀는 사용자 코드의 데이터 결손으로만 드러난다 —
# 이 워크플로가 그 조용한 회귀를 먼저 잡는다.
#
# 계약 위반이 감지되면 `crawler-contract` 라벨의 이슈를 만들거나 갱신하고(제목 고정 →
# 중복 방지), 워크플로를 실패시켜 GitHub 알림(실패 메일/알림)까지 함께 간다.
#
# 일시 장애: 계약 위반 없이 확인 불가(`error`)가 남으면 검증기가 **지연 후 1회 재점검**한
# 뒤 판정한다(기본 15초, `--retry`/`--retry-delay`). 재점검은 판정이 더 강한 쪽만 남기므로
# 드리프트가 가려지지 않는다. 그래도 확인 불가가 남으면 실패로 남긴다(계약 위반과 다른 경고 문구).
# PR 시점에도 같은 계약을 확인해 병합을 막는다: `Contract check (pull requests)`
# (`contract-live.yml`).
#
# 주의:
# - `schedule`은 **기본 브랜치(main)** 에 있는 워크플로 파일만 실행한다.
#   (PR 대상 브랜치에서는 돌지 않으므로 이 파일이 main에 병합돼야 예약 실행이 시작된다.)
# - 저장소에 60일간 활동이 없으면 GitHub가 예약 실행을 자동 비활성화한다.
#   Actions 탭에서 "Enable workflow"로 다시 켤 수 있다.
# - 점검 항목(선택자·엔드포인트·필드 계약)은 `scripts/drift-contracts/`의 매니페스트에
#   선언되어 있다(형식: 같은 폴더 README.md). 실행기는 `scripts/check-site-drift.js`.
#   로컬에서 그대로 돌려볼 수 있다: `npm run build && npm run drift:check`
#
# 선택 설정:
# - 추가 알림(웹훅)을 받으려면 저장소 시크릿 `DRIFT_WEBHOOK_URL`에 Slack/Discord/Teams
#   웹훅 URL을 넣는다(없으면 이슈 알림만 한다).

on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST — 대상 사이트가 국내 시스템이라 점검이 적은 새벽에 돌린다.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: '점검할 사이트 (쉼표 구분, 비우면 전체) — pal,nsm,likms,bridge'
        required: false
        default: ''

permissions:
  contents: read
  # 계약 위반 알림 이슈 생성/코멘트/닫기에 필요(GITHUB_TOKEN)
  issues: write

# 정기 점검이 겹쳐 사이트에 부하를 주지 않도록 동시 실행을 막는다.
concurrency:
  group: site-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRIFT_WEBHOOK_URL: ${{ secrets.DRIFT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      # 계약 매니페스트와 src가 어긋나면(파서만 고친 경우) 실사이트 점검 전에 멈춘다.
      # 이미 PR CI(test.yml)에서도 도는 검증이라, 여기서는 정기 실행 자체를 자가 점검한다.
      - name: Verify contract manifest against src
        run: npm run drift:contracts

      # 점검은 배포 산출물(dist)을 임포트해 **사용자가 실제로 받는 코드**를 기준으로 본다.
      - name: Build dist
        run: npm run build

      - name: Verify live site contracts
        id: check
        # 종료 코드를 읽어 알림 단계를 정해야 하므로 실패를 여기서 멈추지 않는다.
        # 0 = 계약 유지, 1 = 계약 위반(실사이트 응답이 계약과 다름), 2 = 확인 불가(타임아웃 등)
        continue-on-error: true
        env:
          SITES: ${{ inputs.sites }}
        run: |
          set +e
          if [ -n "${SITES}" ]; then
            node scripts/check-site-drift.js \
              --json drift-report/report.json \
              --markdown drift-report/report.md \
              --sites "${SITES}"
          else
            node scripts/check-site-drift.js \
              --json drift-report/report.json \
              --markdown drift-report/report.md
          fi
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      - name: Publish step summary
        if: always()
        run: |
          if [ -f drift-report/report.md ]; then
            cat drift-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "리포트가 생성되지 않았습니다(점검 단계가 시작되기 전에 실패)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-check-report
          # hidden 디렉터리(.drift/)는 upload-artifact의 include-hidden-files 기본값(false)에
          # 걸려 조용히 빈 아티팩트가 된다 → 보이는 디렉터리를 쓴다.
          # (findings/2026-10-14-drift-artifact-hidden-dir)
          path: drift-report/
          if-no-files-found: warn
          retention-days: 30

      # 알림 실패가 점검 결과를 가리지 않도록 continue-on-error로 둔다(판정은 마지막 단계).
      - name: Notify (issue + optional webhook)
        if: always()
        continue-on-error: true
        env:
          CHECK_CODE: ${{ steps.check.outputs.code }}
        run: |
          if [ ! -f drift-report/report.json ]; then
            echo "리포트가 없어 알림을 건너뜁니다(점검이 실행되지 않음)."
            exit 0
          fi
          case "${CHECK_CODE}" in
            0) mode=resolved ;;
            1) mode=drift ;;
            2) mode=inconclusive ;;
            *) echo "점검 코드를 알 수 없어 알림을 건너뜁니다: '${CHECK_CODE}'"; exit 0 ;;
          esac
          bash scripts/notify-site-drift.sh drift-report/report.json "${mode}"

      - name: Fail when contracts are broken
        if: steps.check.outputs.code != '0'
        run: |
          if [ "${{ steps.check.outputs.code }}" = "1" ]; then
            echo "::error::크롤러 계약 위반이 감지되었습니다(실사이트 응답이 계약과 다름) — 'crawler-contract' 이슈와 아티팩트(contract-check-report)를 확인하세요."
          else
            echo "::warning::사이트에 접속하지 못해 계약을 확인하지 못했습니다(일시 장애 가능). 다음 정기 점검에서 반복되면 조사하세요."
          fi
          exit 1
